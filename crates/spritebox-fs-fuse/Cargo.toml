[package]
name = "spritebox-fs-fuse"
version = "0.1.0"
edition = "2024"
description = "FUSE adapter for the spritebox virtual filesystem (Linux only)"
license = "MIT"

[dependencies]
spritebox-fs-protocol = { workspace = true }
spritebox-fs-remote = { workspace = true }
spritebox-fs-transport = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# default features include `libfuse` which calls pkg-config and breaks
# cross-compilation from macOS. Disable it; the pure-Rust mount path
# still works and on real Linux we can opt back into libfuse if needed.
fuser = { version = "0.15", default-features = false, features = ["abi-7-31"] }
libc = "0.2"
